name: code-nexus

services:
  mysql:
    image: mysql:8.0
    container_name: code-nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-code_nexus}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./docker/backend
    container_name: code-nexus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      omr:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-code_nexus}
      DB_USERNAME: ${MYSQL_USER:-nexus}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      QUEUE_CONNECTION: database
      DB_QUEUE: omr
      DB_QUEUE_RETRY_AFTER: 180
      OMR_SERVICE_URL: http://omr:5005
      OMR_CONNECT_TIMEOUT: 5
      OMR_REQUEST_TIMEOUT: 120
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:80"

  omr:
    build:
      context: ./omr
      dockerfile: ../docker/omr/Dockerfile
    container_name: code-nexus-omr
    restart: unless-stopped
    volumes:
      - ./omr:/app
    ports:
      - "127.0.0.1:5005:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6

  omr-worker:
    build:
      context: ./docker/backend
    container_name: code-nexus-omr-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      omr:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-code_nexus}
      DB_USERNAME: ${MYSQL_USER:-nexus}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      QUEUE_CONNECTION: database
      DB_QUEUE: omr
      DB_QUEUE_RETRY_AFTER: 180
      OMR_SERVICE_URL: http://omr:5005
      OMR_CONNECT_TIMEOUT: 5
      OMR_REQUEST_TIMEOUT: 120
    volumes:
      - ./backend:/var/www/html
    command: ["php", "artisan", "queue:work", "database", "--queue=omr", "--sleep=1", "--tries=3", "--timeout=135", "--max-time=3600"]

volumes:
  mysql_data:
