name: code-nexus-production

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-code_nexus}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  omr:
    build:
      context: ./omr
      dockerfile: ../docker/omr/Dockerfile
    restart: unless-stopped
    environment:
      OMR_OPENCV_THREADS: ${OMR_OPENCV_THREADS:-8}
      OMR_TORCH_THREADS: ${OMR_TORCH_THREADS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    image: code-nexus-backend:production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      omr:
        condition: service_healthy
    environment: &backend-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      APP_URL: ${APP_URL:?Set APP_URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-code_nexus}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      QUEUE_CONNECTION: database
      DB_QUEUE: omr
      DB_QUEUE_RETRY_AFTER: 240
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      OMR_SERVICE_URL: http://omr:5005
      OMR_CONNECT_TIMEOUT: 5
      OMR_REQUEST_TIMEOUT: 180
      ANSWER_SHEET_RETENTION_DAYS: ${ANSWER_SHEET_RETENTION_DAYS:-365}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      INITIAL_STAFF_PASSWORD: ${INITIAL_STAFF_PASSWORD:?Set INITIAL_STAFF_PASSWORD}
    volumes:
      - answer_sheet_data:/var/www/html/storage/app/private
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  omr-worker:
    image: code-nexus-backend:production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      omr:
        condition: service_healthy
    environment: *backend-environment
    volumes:
      - answer_sheet_data:/var/www/html/storage/app/private
    command: ["php", "artisan", "queue:work", "database", "--queue=omr", "--sleep=1", "--tries=3", "--timeout=210", "--max-time=3600"]

  scheduler:
    image: code-nexus-backend:production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment: *backend-environment
    volumes:
      - answer_sheet_data:/var/www/html/storage/app/private
    command: ["php", "artisan", "schedule:work"]

volumes:
  mysql_data:
  answer_sheet_data:
